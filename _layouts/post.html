---
layout: default
---
<article style="max-width: 800px; margin: 0 auto;">
    <a href="{{ '/' | relative_url }}" style="color: var(--accent-color); font-weight: 600;">← Back to Home</a>
    
    <h1 style="font-size: 2.5rem; margin-top: 30px; margin-bottom: 10px;">{{ page.title }}</h1>
    <p style="color: var(--secondary-text); margin-bottom: 40px; font-family: monospace;">
        {{ page.date | date: "%B %d, %Y" }}
    </p>

    <div class="post-content">
        {{ content }}
    </div>
</article>
