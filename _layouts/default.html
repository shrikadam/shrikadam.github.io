<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shriniwas Kadam | AI Roboticist</title>
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-color: #fcfbf9;
            --text-color: #333333;
            --accent-color: #2c5282;
            --secondary-text: #666666;
            --border-color: #eaeaea;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0 40px;
        }

        a { text-decoration: none; color: inherit; transition: color 0.2s; }
        a:hover { color: var(--accent-color); }

        /* --- LAYOUT UTILS --- */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 0; /* Reduced from 80px */
        }

        /* --- HEADER --- */
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 40px; /* Reduced from 60px */
            margin-bottom: 50px; /* Reduced from 60px */
            align-items: center;
            position: relative;
        }

        .profile-photo {
            width: 200px; /* Shrunk slightly for compactness */
            height: 200px;
            background-color: #eee;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
        }

        .bio-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bio-section h1 { font-size: 2.2rem; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
        .bio-section .role { font-size: 1.1rem; color: var(--secondary-text); margin-bottom: 12px; display: block; }
        .bio-section p { font-size: 0.95rem; max-width: 600px; }

        .socials { margin-top: 15px; }
        .socials a {
            margin-right: 20px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--accent-color);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }
        .socials a:hover { text-decoration: none; }

        /* --- SEARCH BAR --- */
        .search-wrapper { margin-top: 20px; position: relative; max-width: 300px; }
        #searchInput {
            width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 0.9rem; background: rgba(255, 255, 255, 0.5); transition: all 0.2s;
        }
        #searchInput:focus { outline: none; border-color: var(--accent-color); background: white; box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1); }

        /* --- NAV --- */
        nav { position: absolute; top: 0; right: 0; }
        nav ul { list-style: none; display: flex; gap: 25px; }
        nav a { font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--secondary-text); letter-spacing: 0.2px; }
        nav a:hover { color: var(--accent-color); }

        @media (max-width: 850px) {
            nav { position: static; margin-bottom: 20px; width: 100%; }
            header { flex-direction: column; gap: 25px; text-align: left; align-items: flex-start; }
            .profile-photo { width: 150px; height: 150px; }
        }

        /* --- SECTIONS --- */
        section { margin-bottom: 50px; scroll-margin-top: 20px; } /* Reduced from 90px */
        .section-header {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;
        }
        h2 { font-size: 1.4rem; font-weight: 700; color: #111; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; } /* Tighter gap */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { border-color: #bbb; transform: translateY(-2px); }
        .thumbnail { width: 100%; height: 130px; background-color: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #999; font-size: 0.8rem; }
        .card-content { padding: 15px; }
        .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 5px; display: block; }
        .card-meta { font-size: 0.75rem; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-desc { font-size: 0.85rem; color: #555; line-height: 1.5; }

        /* --- PAPERS --- */
        .paper-item { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
        .paper-thumb { width: 70px; height: 90px; background-color: #f4f4f4; flex-shrink: 0; border: 1px solid #eee; }
        .paper-details h3 { font-size: 1.05rem; margin-bottom: 5px; font-weight: 600; }
        .paper-details p { font-size: 0.9rem; color: #444; margin-bottom: 6px; }
        .paper-links a { font-size: 0.85rem; color: var(--accent-color); margin-right: 12px; font-weight: 600; }

        /* --- BLOGS --- */
        .blog-list { display: flex; flex-direction: column; gap: 0; }
        /* Changed align-items from baseline to center so the image aligns nicely */
        .blog-item { display: flex; padding: 15px 0; border-bottom: 1px solid #f0f0f0; align-items: center; } 
        .blog-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 20px; }
        .blog-item:hover .blog-title { color: var(--accent-color); }
        .blog-date { width: 120px; flex-shrink: 0; font-size: 0.85rem; color: var(--secondary-text); font-family: monospace; }
        
        /* NEW: Thumbnail Styling (Moved to right, 4:3 ratio) */
        .blog-thumb { width: 100px; height: 75px; flex-shrink: 0; margin-left: 20px; border-radius: 4px; overflow: hidden; background-color: #f4f4f4; border: 1px solid var(--border-color); }
        .blog-thumb img { width: 100%; height: 100%; object-fit: cover; }
        
        .blog-content { flex-grow: 1; }
        .blog-title { font-size: 1rem; font-weight: 600; display: block; margin-bottom: 4px; }
        .blog-subtitle { font-size: 0.9rem; color: #666; display: block; }

        @media (max-width: 600px) {
            .blog-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .blog-date { width: auto; font-size: 0.8rem; color: #888; margin-bottom: 0; }
            /* Mobile thumbnail logic */
            .blog-thumb { width: 100%; height: auto; aspect-ratio: 4/3; margin-left: 0; margin-top: 10px; }
        }

        /* --- UTILS --- */
        .hidden-item { display: none !important; }
        .see-all-btn { background: none; border: none; color: var(--secondary-text); cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .see-all-btn:hover { color: var(--accent-color); }
        .no-results { display: none; font-size: 0.9rem; color: #888; font-style: italic; padding: 20px 0; }
        
        /* --- POST CONTENT STYLING (Markdown Fixes) --- */
        .post-content { margin-top: 30px; font-size: 1rem; color: #222; }
        .post-content h1, .post-content h2, .post-content h3, .post-content h4 { margin-top: 35px; margin-bottom: 15px; font-weight: 700; color: #111; }
        .post-content p { margin-bottom: 18px; line-height: 1.7; }
        .post-content hr { border: 0; border-top: 2px solid var(--border-color); margin: 40px 0; } /* Fixed horizontal line spacing */
        .post-content ul, .post-content ol { margin-bottom: 20px; padding-left: 25px; }
        .post-content li { margin-bottom: 8px; }
        .post-content blockquote { border-left: 4px solid var(--accent-color); padding-left: 15px; color: var(--secondary-text); font-style: italic; margin-bottom: 20px; }

        /* --- SYNTAX HIGHLIGHTING (GitHub Style) --- */
        .highlight { background: #f6f8fa; padding: 15px; border-radius: 6px; overflow-x: auto; margin-bottom: 20px; font-family: Consolas, Monaco, "Courier New", monospace; font-size: 0.9rem; border: 1px solid var(--border-color); }
        .highlight .c, .highlight .c1 { color: #6a737d; font-style: italic; } 
        .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr, .highlight .kv { color: #d73a49; font-weight: bold; } 
        .highlight .o, .highlight .ow { color: #d73a49; font-weight: bold; } 
        .highlight .s, .highlight .s1, .highlight .s2 { color: #032f62; } 
        .highlight .m, .highlight .mi, .highlight .mf { color: #005cc5; } 
        .highlight .nf, .highlight .fm { color: #6f42c1; font-weight: 600; } 
        .highlight .nc { color: #6f42c1; font-weight: 600; } 
        .highlight .nb { color: #005cc5; } 
        .highlight .err { color: #b31d28; background-color: #ffeef0; } 

        footer { text-align: center; padding: 30px 0; color: #aaa; font-size: 0.8rem; border-top: 1px solid var(--border-color); margin-top: 40px; }
    </style>
</head>

<body>

    <div class="container">
        {% if page.url == '/' or page.url == '/index.html' %}
        <header>
            <img src="{{ '/assets/images/profile.png' | relative_url }}" alt="Profile Photo" class="profile-photo">

            <div class="bio-section">
                <!-- <nav>
                    <ul>
                        <li><a href="{{ '/' | relative_url }}#blogs">Blog</a></li>
                        <li><a href="{{ '/' | relative_url }}#projects">Projects</a></li>
                        <li><a href="{{ '/' | relative_url }}#papers">Papers</a></li>
                        <li><a href="{{ '/' | relative_url }}#videos">Videos</a></li>
                    </ul>
                </nav>  -->

                <h1>Shriniwas Kadam</h1>
                <span class="role">AI Roboticist & Researcher</span>
                <p>
                    Building robots that act in the unstructured world.
                </p>

                <div class="socials">
                    <a href="https://github.com/shrikadam" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <a href="https://www.linkedin.com/in/shrikadam" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                    <a href="https://www.youtube.com/@volo.machina" target="_blank" rel="noopener noreferrer">YouTube</a>
                    <!-- <a href="#">Google Scholar</a> -->
                </div>

                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Search projects, papers, topics...">
                </div>
            </div>
        </header>
        {% endif %}

        {{ content }}

        <footer>
            <p>&copy; 2026 Shriniwas Kadam.</p>
        </footer>

    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            const sections = ['blogs', 'projects', 'papers', 'videos'];
            const defaultVisibleCounts = { 'blogs': 6, 'projects': 8, 'papers': 4, 'videos': 8 };

            window.addEventListener('DOMContentLoaded', () => {
                sections.forEach(sectionId => resetSection(sectionId));
            });

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                const isSearching = term.length > 0;

                sections.forEach(sectionId => {
                    let container = document.getElementById('grid-' + sectionId) || document.getElementById('list-' + sectionId);
                    if(!container) return; // Skip if on a blog post page
                    
                    const items = container.querySelectorAll('.search-target');
                    const seeAllBtn = document.querySelector(`#${sectionId} .see-all-btn`);
                    const noResultsMsg = document.querySelector(`#${sectionId} .no-results`);
                    let visibleCount = 0;

                    if (isSearching) {
                        if(seeAllBtn) seeAllBtn.style.display = 'none';
                        items.forEach(item => {
                            if (item.innerText.toLowerCase().includes(term)) {
                                item.classList.remove('hidden-item');
                                visibleCount++;
                            } else {
                                item.classList.add('hidden-item');
                            }
                        });
                        if (noResultsMsg) noResultsMsg.style.display = visibleCount === 0 ? 'block' : 'none';
                    } else {
                        resetSection(sectionId);
                    }
                });
            });

            function resetSection(sectionId) {
                let container = document.getElementById('grid-' + sectionId) || document.getElementById('list-' + sectionId);
                if(!container) return;
                const items = container.querySelectorAll('.search-target');
                const seeAllBtn = document.querySelector(`#${sectionId} .see-all-btn`);
                const noResultsMsg = document.querySelector(`#${sectionId} .no-results`);
                const limit = defaultVisibleCounts[sectionId];
                const total = items.length;

                items.forEach((item, index) => {
                    if (index < limit) item.classList.remove('hidden-item');
                    else item.classList.add('hidden-item');
                });

                if (seeAllBtn) {
                    seeAllBtn.innerText = 'See All';
                    seeAllBtn.style.display = (total > limit) ? 'inline-block' : 'none';
                }
                if (noResultsMsg) noResultsMsg.style.display = 'none';
            }
        }

        function toggleSection(sectionId) {
            let container = document.getElementById('grid-' + sectionId) || document.getElementById('list-' + sectionId);
            const btn = document.querySelector(`#${sectionId} .see-all-btn`);
            if (btn.innerText === "See All") {
                const allItems = container.querySelectorAll('.search-target');
                allItems.forEach(item => item.classList.remove('hidden-item'));
                btn.innerText = "Show Less";
            } else {
                const defaultVisibleCounts = { 'blogs': 6, 'projects': 8, 'papers': 4, 'videos': 8 };
                const limit = defaultVisibleCounts[sectionId];
                const items = container.querySelectorAll('.search-target');
                items.forEach((item, index) => {
                    if (index >= limit) item.classList.add('hidden-item');
                });
                btn.innerText = "See All";
                document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
